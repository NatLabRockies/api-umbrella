parsers:
  - name: plaintext
    format: regex
    regex: "^(?<msg>.+)$"
  - name: try_json
    format: regex
    regex: "^(?<msg>.+)$"
    decode_field_as: json msg

  - name: syslog-rfc5424
    format: regex
    regex: '^\<[0-9]{1,5}\>1 (?<time>[^ ]+) [^ ]+ (?<service>[^ ]+) [-0-9]+ [^ ]+ (\[(.*?)\]|-) (?<msg>.+)$'
    time_key: time
    time_format: "%Y-%m-%dT%H:%M:%S.%L%z"
    time_keep: on
    decode_field_as: json msg



