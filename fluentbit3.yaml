service:
  flush: 1
  log_level: info

pipeline:
  inputs:
    - name: fluentbit_metrics
      tag: internal_metrics
      scrape_interval: 2

    - name: fluentbit_logs
      tag: internal_logs

    - name: cpu
      tag: cpu_metrics
      interval_sec: 10

    - name: disk
      tag: disk_metrics
      interval_sec: 10

    - name: netif
      tag: netif_metrics
      interface: eth0
      interval_sec: 10

    - name: process_exporter_metrics
      tag:  process_metrics
      scrape_interval: 2

    - name: proc
      proc_name: bash
      interval_sec: 1
      interval_nsec: 0
      fd: true
      mem: true

    - name: prometheus_scrape
      host: 127.0.0.1
      port: 13010
      tag: vault
      metrics_path: /_nginx-status/format/prometheus
      scrape_interval: 2s

  outputs:
    - name: stdout
      match: "*"
      format: json
      json_date_format: iso8601
      json_date_key: _log_time
